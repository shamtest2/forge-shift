<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a10" />
    <meta name="description" content="FORGE//SHIFT — reshape the route. Master the run." />
    <title>FORGE//SHIFT — Master the route</title>
    <script>
      // The publisher SDK is loaded before game boot on CrazyGames. Local/other hosts
      // never require a third-party request to enter gameplay.
      window.__forgeSdkScript = new Promise((resolve) => {
        const onPortal = /(^|\.)crazygames\.com$/i.test(location.hostname) ||
          /(^|\.)crazygames\.com$/i.test((() => { try { return new URL(document.referrer).hostname; } catch { return ''; } })());
        if (!onPortal && new URLSearchParams(location.search).get('sdk') !== '1') {
          resolve(false);
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
        script.onload = () => resolve(true);
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    </script>
  </head>
  <body>
    <div id="app"><div class="boot">FORGE<span>//</span>SHIFT <small>INITIALIZING SYSTEMS</small></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
